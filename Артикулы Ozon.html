<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Артикулы Ozon</title>
<style>

header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 26px;background:linear-gradient(135deg,#005bff,#7a3dff 55%,#f91155,#005bff);background-size:250% 250%;animation:gshift 9s ease infinite;color:#fff;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:14px;overflow:hidden;position:relative}

.cl{font-size:11px;color:var(--pk);font-weight:700}

.tot{font-size:24px;font-weight:800}.sv{color:var(--ok);font-weight:700}

.sheet{position:relative;background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sl .4s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto}

.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}

.ar{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ac);display:none;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}

.f{box-shadow:inset 0 0 14px rgba(0,0,0,.14)}
.f:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-130%);animation:shine 3.6s infinite;z-index:1;pointer-events:none}
.f:after{content:"";position:absolute;inset:0;pointer-events:none}
.f:nth-child(1):after{background:linear-gradient(135deg,rgba(255,255,255,.2),transparent)}

.f:nth-child(5):after{background:rgba(255,255,255,.22)}.f:nth-child(6):after{background:rgba(15,27,61,.4)}

.stage .scene{animation:floaty 3.2s ease-in-out infinite}

.ctl{display:flex;justify-content:center;gap:8px;margin:-8px 0 6px}.ctl button{width:40px;height:40px;border-radius:12px;border:0;background:var(--ac2);color:var(--ac);font-size:17px;font-weight:700}

.tg{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:6px}.tg.dn{background:#dcf7e8;color:var(--ok)}.tg.up{background:#fff0e0;color:#d9730d}

.rxs{display:flex;gap:6px;align-items:center;margin:2px 0 8px;flex-wrap:wrap}
.rx{border:0;background:var(--ac2);color:var(--ac);padding:6px 11px;border-radius:12px;font-weight:700;font-size:13px;transition:transform .15s,background .2s}.rx:active{transform:scale(.88)}.rx.on{background:var(--ac);color:#fff}
.chl{max-height:52vh;min-height:140px;overflow-y:auto;padding:6px 2px}.cml{max-height:260px;overflow-y:auto}

.mh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap}.mh b{color:var(--tx)}.mh .x{margin-left:auto;cursor:pointer;color:#e5484d;padding:0 4px;font-weight:700}
.au{background:var(--pk);color:#fff;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:700}
.avt{flex:none;width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.cmx{margin-top:16px;border-top:1px solid var(--bd);padding-top:12px}
.ann{background:linear-gradient(135deg,#fff0f5,#e6eeff);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:600;animation:up .4s both}
.lst{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border-radius:16px;padding:11px 12px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;justify-content:space-between}
.lm{min-width:0;flex:1}.lm .nm{margin:5px 0 2px;cursor:pointer}
.lr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,91,255,.1)}
.seg b{flex:1;text-align:center;padding:8px 6px;border-radius:11px;font-size:13px;color:var(--mut);cursor:pointer;transition:.2s}.seg b.on{background:var(--ac);color:#fff}
.sl img{opacity:0;transition:opacity .45s}.sl img.ld{opacity:1}
.gal .sl img{object-fit:cover}.gal .sl img[data-lb]{cursor:zoom-in}
.zmh{position:absolute;left:10px;bottom:10px;background:rgba(15,27,61,.6);color:#fff;font-size:12px;padding:4px 9px;border-radius:10px;pointer-events:none}
#lb{position:fixed;inset:0;z-index:60;background:rgba(5,10,25,.95);display:none}#lb.on{display:block;animation:fade .2s}
.lbw{position:relative;width:100%;height:100%}.lbw .sl{height:100%}.lbw .sl img{object-fit:contain}.lbw .ar{display:flex}
.lbn{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:700;pointer-events:none}
.lbx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;cursor:pointer;z-index:3}
.desc{white-space:pre-line;opacity:.88;margin:8px 0;line-height:1.5}
.snip{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}.tile b{display:block;font-size:22px;color:var(--ac)}.tile span{font-size:11px;color:var(--mut)}.tile.warn b{color:#d9730d}
.arow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;margin-bottom:8px;box-shadow:var(--sh)}
.th{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:22px}.th img{width:100%;height:100%;object-fit:cover}
.am{flex:1;min-width:0}.am b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aa{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:114px}.ib{width:34px;height:34px;border:0;border-radius:10px;background:var(--ac2);font-size:15px}.ib.del{background:#ffe5e7}
.step{display:flex;align-items:center;gap:8px;font-weight:800;margin:16px 0 2px}.step span{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
details.acc{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}details.acc summary{font-weight:700;cursor:pointer;list-style:none}details.acc summary::-webkit-details-marker{display:none}details.acc[open]>summary{margin-bottom:10px}

.rvc{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px!important}.rvc img{width:30px;height:30px;border-radius:50%;object-fit:cover}.rvc span{font-size:13px}
#up{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:800;box-shadow:0 6px 18px rgba(0,91,255,.4);z-index:19;cursor:pointer}#up.on{display:flex;animation:fade .2s}
.stars{display:flex;gap:2px}.stars span{font-size:32px;line-height:1;color:#d5dbe8;cursor:pointer;transition:transform .15s,color .2s}.stars span.on{color:#ffb400}.stars span:active{transform:scale(1.3)}
.phead{display:flex;align-items:center;justify-content:space-between}
.pav{width:72px;height:72px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex:none}
.medals{display:flex;padding-left:10px}
.medal{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.65),transparent 45%),var(--c);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.18);margin-left:-10px;border:3px solid #fff;flex:none}.medal.lk{filter:grayscale(1);opacity:.45}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px;text-align:center}.pstats b{display:block;font-size:17px}.pstats span{font-size:11px;color:var(--mut)}

.bt{width:100%;border-collapse:collapse;font-size:12px}.bt td,.bt th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}.bt th{color:var(--mut)}
.lock{cursor:pointer}.hb{background:var(--pk);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 6px;margin-left:6px;font-weight:700}
.soldout .ph{filter:grayscale(1);opacity:.75}.soldout .rp,.soldout .cp,.soldout .op{opacity:.55}
.so{position:absolute;left:0;right:0;bottom:0;background:rgba(15,27,61,.82);color:#fff;text-align:center;font-weight:800;padding:6px;font-size:13px;z-index:2}
#fab{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#f91155,#7a3dff);color:#fff;display:none;align-items:center;justify-content:center;font-size:30px;font-weight:300;box-shadow:0 8px 22px rgba(249,17,85,.45);z-index:19;cursor:pointer}#fab.on{display:flex;animation:fade .2s}
@keyframes shine{60%,100%{transform:translateX(130%)}}@keyframes floaty{50%{transform:translateY(-10px)}}

<header><div class="scene"><div class="cube" id="hc"></div></div><div><h1>Артикулы Ozon</h1><p>Цены, скидки по Ozon Карте</p></div><span class="lock" id="hsup" data-sup="1">🛟 Поддержка</span></header>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function shrink(f,cr){
  const b=await createImageBitmap(f),has=cr&&(cr.t||cr.b||cr.l||cr.r),M=1800;
  const sx=has?b.width*cr.l/100:0,sy=has?b.height*cr.t/100:0,sw=b.width-sx-(has?b.width*cr.r/100:0),sh=b.height-sy-(has?b.height*cr.b/100:0);
  if(!has&&Math.max(b.width,b.height)<=M&&f.size<2.5e6&&/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  const k=Math.min(1,M/Math.max(sw,sh)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
  const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(b,sx,sy,sw,sh,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.92));
}
